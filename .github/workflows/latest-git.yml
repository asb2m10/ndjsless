name: latest-git

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-git
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: latest-git

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Replace the latest-git release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-git --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest-git dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest git (${GITHUB_SHA::7})" \
            --notes "Automated build of \`main\` at ${GITHUB_SHA::7}. Not a stable release."
